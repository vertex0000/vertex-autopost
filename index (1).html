<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex Autopost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0711; --card:#161222; --card-2:#1D1830; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#F2EEF7; --muted:#A79FB5; --faint:#6E6683;
  --accent:#A855F7; --accent-2:#EC4899; --ok:#34D399; --warn:#FBBF24; --err:#FB7185;
  --hero:linear-gradient(115deg,#4E1233 0%,#3A1233 42%,#241438 100%);
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(700px 460px at 78% -10%,rgba(168,85,247,.16),transparent 60%),radial-gradient(520px 420px at 4% 106%,rgba(236,72,153,.10),transparent 60%)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1{font-size:30px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px}
h1 .dim{color:#8B7FA3}
h2{font-size:15px;font-weight:500;margin:0;color:var(--muted)}
p{margin:0}
.lead{color:var(--muted);max-width:62ch}
.hint{color:var(--faint);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;z-index:1;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:rgba(12,9,18,.7);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:500;font-size:17px;text-decoration:none}
.mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav a[aria-current=page]{color:var(--text);background:rgba(168,85,247,.16)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
.nav .count.err{color:var(--err)}
.acct{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;display:flex;gap:10px;align-items:center;font-size:13px}
.main{padding:22px 34px 70px;max-width:1260px;width:100%}
.top{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:22px;min-height:40px}
.top .menu-btn,.scrim{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}

.hero{background:var(--hero);border:1px solid rgba(255,255,255,.09);border-radius:26px;padding:30px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:34px;align-items:center;box-shadow:0 30px 60px -40px rgba(168,85,247,.5)}
.chips{display:flex;gap:10px;margin-bottom:22px}
.ichip{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#F6E9FF;font-size:13px}
.hero h3{font-size:34px;font-weight:400;letter-spacing:-.02em;margin:0 0 10px;line-height:1.15}
.hero .sub{color:rgba(255,255,255,.72);max-width:44ch}
.hero-foot{display:flex;align-items:center;gap:10px;margin-top:26px;color:rgba(255,255,255,.8);font-size:14px}
.shot{background:#fff;border-radius:16px;padding:14px;color:#101015;box-shadow:0 24px 50px -24px rgba(0,0,0,.6)}
.shot .ph{border-radius:10px;overflow:hidden;background:#f3f0f8}
.shot .ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.shot .cap{font-size:12px;line-height:1.45;color:#3B3548;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.shot .meta{display:flex;justify-content:space-between;font-size:11px;color:#6B6480;margin-top:10px}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.grid2{align-items:start;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.link{cursor:pointer;text-decoration:none;display:block;transition:border-color .18s,background .18s}
.card.link:hover{border-color:var(--line2);background:var(--card-2)}
.card h3{font-size:19px;font-weight:400;margin:0 0 6px;letter-spacing:-.01em}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:13px;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.big{font-size:38px;font-weight:400;letter-spacing:-.03em;line-height:1.05}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.danger{color:var(--err);border-color:rgba(251,113,133,.35)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.icon{width:34px;height:34px;padding:0}
.btn:disabled{opacity:.35;cursor:default}
.pill{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line2);background:rgba(255,255,255,.04);cursor:pointer;font-size:14px}
.led{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill[aria-pressed=true] .led{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:12px;color:#fff}
.tg{position:relative;flex:none;width:44px;height:25px;border-radius:99px;background:#332B45;border:0;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked=true]{background:var(--accent)}
.tg[aria-checked=true]::after{transform:translateX(19px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.07);font-size:13px}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:var(--faint);display:grid}
.chip button:hover{color:var(--text)}
.st{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.q{background:rgba(168,85,247,.18);color:#D8B4FE}
.st.p,.st.ok{background:rgba(52,211,153,.14);color:#6EE7B7}
.st.warn{background:rgba(251,191,36,.14);color:#FCD34D}
.st.err{background:rgba(251,113,133,.14);color:#FDA4AF}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#FDE68A;font-size:14px;margin-bottom:18px}
.banner.info{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.3);color:#E9D5FF}
.empty{text-align:center;padding:42px 16px;color:var(--muted)}

input,textarea,select{color-scheme:dark;width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;color:var(--text);font:inherit;font-size:14px;padding:11px 13px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23A79FB5' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:38px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
.seg button{height:32px;padding:0 13px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer}
.seg button[aria-selected=true]{background:rgba(255,255,255,.1);color:var(--text)}

/* Settings rows with dropdowns */
.opt{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0;padding-top:2px}
.opt .t{font-size:15px}
.opt .d{font-size:13px;color:var(--muted);max-width:56ch;margin-top:2px}
.opt .c{justify-self:end;width:100%;display:flex;justify-content:flex-end;gap:8px}
.path{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

.rows .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0;padding-top:0}
.rows .k{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{padding:10px 4px;border-radius:12px;text-align:center;background:rgba(255,255,255,.04);font-size:13px}
.day.today{box-shadow:inset 0 0 0 1px rgba(168,85,247,.55)}
.day small{display:block;color:var(--faint);font-size:12px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.p{background:var(--ok)}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0;padding-top:0}
.feed .lv{width:8px;height:8px;border-radius:50%;flex:none}
.lv.ok{background:var(--ok)}.lv.warn{background:var(--warn)}.lv.err{background:var(--err)}
.feed time{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}

.drop{display:flex;align-items:center;gap:16px;padding:20px;border:1.5px dashed var(--line2);border-radius:16px;cursor:pointer;margin-bottom:20px}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(168,85,247,.07)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tile img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.tile.posted img{opacity:.45}
.tile .no{position:absolute;top:8px;left:8px;background:rgba(10,7,17,.8);font-size:12px;padding:2px 9px;border-radius:99px}
.tile .st{position:absolute;bottom:8px;left:8px;background:rgba(10,7,17,.8)}
.tile .del{position:absolute;top:6px;right:6px;opacity:0;background:rgba(10,7,17,.85);border-color:transparent}
.tile:hover .del,.tile:focus-within .del{opacity:1}
.ce{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,.9fr);gap:18px;align-items:start}
.tpl-list button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--muted);cursor:pointer}
.tpl-list button[aria-current=true]{background:rgba(255,255,255,.07);color:var(--text)}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.vars button{border:1px dashed var(--line2);background:none;border-radius:9px;padding:4px 9px;font-size:13px;color:#D8B4FE;cursor:pointer}
.preview{white-space:pre-wrap;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;color:#D9D2E6;min-height:140px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

.ql{list-style:none;margin:0;padding:0}
.ql li{display:grid;grid-template-columns:20px 26px 54px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:13px 6px;border-top:1px solid var(--line)}
.ql li:first-child{border-top:0}
.ql li.dragging{opacity:.35}
.ql li.over{background:rgba(168,85,247,.1);border-radius:12px}
.ql .grip{color:var(--faint);cursor:grab;display:grid}
.ql .seq{color:var(--faint);text-align:center}
.ql img{width:54px;height:68px;object-fit:cover;border-radius:10px;display:block}
.ql .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql .cap.ai{color:var(--muted)}
.ctl{display:flex;gap:4px}

.srow{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add-time input{width:126px;padding:7px 10px}
.add-time{display:inline-flex;gap:6px;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--faint);text-align:center;padding-bottom:4px}
.cell{min-height:80px;border-radius:12px;background:rgba(255,255,255,.035);padding:6px;font-size:12px;overflow:hidden}
.cell.out{opacity:.3}.cell.today{box-shadow:inset 0 0 0 1px var(--accent)}
.cell img{width:100%;height:44px;object-fit:cover;border-radius:7px;margin-top:4px;display:block}
.cell img.p{opacity:.5}
.cell .more{font-size:11px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.kpi{padding:18px 20px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:25px;margin-top:4px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--ok)}.kpi .d.neg{color:var(--err)}
.an{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.chart{width:100%;height:230px;display:block}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:8px}
.hours{display:flex;align-items:flex-end;gap:5px;height:130px}
.hours div{flex:1;border-radius:6px 6px 2px 2px;background:rgba(168,85,247,.28)}
.hours div.best{background:var(--accent)}
.tp{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.tp img{width:46px;height:58px;object-fit:cover;border-radius:9px}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:400;color:var(--faint);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .t{white-space:nowrap;color:var(--muted)}
.log-tools{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.log-tools input{max-width:280px}

/* Hero + template-style cards */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px;margin-bottom:22px;
  background:linear-gradient(120deg,#3A1030 0%,#241436 55%,#160F26 100%);border:1px solid rgba(236,72,153,.18)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 92% 0%,rgba(236,72,153,.18),transparent 65%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:28px;align-items:center}
.chips{display:flex;gap:10px;margin-bottom:20px}
.chip-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;color:#F5D0FE}
.chip-icon.more{font-size:13px;font-weight:600;color:var(--muted)}
.hero h2{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:10px}
.hero .sub{color:#CDBEEA;max-width:46ch}
.hero .actions{margin-top:22px}
.hero-panel{background:linear-gradient(120deg,#35102C 0%,#1C1229 58%,#150F22 100%);border-color:rgba(236,72,153,.18)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tcard{display:flex;flex-direction:column;gap:16px;min-height:168px;padding:20px;border-radius:18px;background:var(--surface);
  border:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;text-align:left}
.tcard:hover{border-color:rgba(196,181,253,.34);background:#191223}
.tcard .t{font-size:17px;line-height:1.35}
.tcard .foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.opt{display:grid;gap:4px}
.opt select{min-width:230px}
.path-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:#C4B5FD;background:rgba(139,92,246,.1);border:1px solid var(--line);padding:2px 8px;border-radius:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  background:var(--card-2);border:1px solid var(--line2);padding:11px 17px;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:60;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1080px){
  .hero{grid-template-columns:1fr}
  .shot{max-width:360px}
  .grid3{grid-template-columns:1fr 1fr}
  .ce{grid-template-columns:200px minmax(0,1fr)}
  .hero-grid{grid-template-columns:minmax(0,1fr) 340px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:264px;transform:translateX(-100%);transition:transform .25s;z-index:50;background:#0C0912}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,3,10,.65);z-index:40}
  .main{padding:14px 16px 70px}
  .top{justify-content:space-between}
  .top .menu-btn{display:inline-flex}
  h1{font-size:25px}
  .hero{padding:22px;border-radius:20px}
  .hero h3{font-size:27px}
  .grid3,.grid2,.an,.ce{grid-template-columns:1fr}
  .opt{grid-template-columns:1fr;gap:10px}
  .opt .c{justify-self:stretch}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-left:0;border-top:1px solid var(--line)}
  .kpi:nth-child(even){border-left:1px solid var(--line)}
  .kpi:nth-child(-n+2){border-top:0}
  .ql li{grid-template-columns:22px 52px minmax(0,1fr) auto;gap:10px}
  .ql .grip,.ql .when-col{display:none}
  .tile .del{opacity:1}
  .cell{min-height:58px}.cell img{height:28px}
}

/* Library-style shell */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:12px 26px;
  border-bottom:1px solid var(--line);background:rgba(11,7,17,.78);backdrop-filter:blur(16px)}
.topbar .brand{padding:0;font-size:16px;white-space:nowrap}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.nav a:hover{color:var(--text);border-color:var(--line2)}
.nav a[aria-current=page]{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.5);color:#F5F3FF}
.nav .count{font-size:12px;color:var(--faint)}
.nav .count.err{color:var(--err)}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.main{max-width:1120px;margin:0 auto;padding:26px 26px 72px}
.libhero{text-align:center;padding:46px 0 8px}
.libhero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.12;letter-spacing:-.025em;margin:0 auto;max-width:18ch}
.libhero .dim{background:linear-gradient(90deg,#C4B5FD,#F0ABFC);-webkit-background-clip:text;color:transparent}
.libhero .lead{margin:14px auto 0}
.search{display:flex;align-items:center;gap:10px;max-width:640px;margin:26px auto 0;padding:8px 12px;
  border-radius:14px;border:1px solid var(--line2);background:rgba(24,17,35,.75)}
.search .tagchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4);font-size:13px;color:#E9D5FF}
.search input{border:0;background:none;padding:6px 2px;font-size:15px}
.search input:focus{outline:none}
.search .go{color:var(--faint);display:grid}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px auto 0}
.cats button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13.5px;cursor:pointer}
.cats button[aria-selected=true]{background:rgba(236,72,153,.16);border-color:rgba(236,72,153,.4);color:#FBCFE8}
.sec{display:flex;align-items:baseline;gap:10px;margin:40px 0 18px;font-size:20px;font-weight:600}
.sec .dim{color:var(--faint);font-weight:400;font-size:16px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.cardgrid .card{min-height:172px;display:flex;flex-direction:column;gap:14px}
.cardgrid .card h3{font-size:16.5px;font-weight:500;line-height:1.4;margin:0}
.cardgrid .card .foot{margin-top:auto}
@media (max-width:900px){
  .topbar{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .nav{order:3;width:100%;flex:none;padding-bottom:2px}
  .main{padding:16px 14px 72px}
  .libhero{padding:26px 0 4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/overview"><span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l8 14 8-14"/></svg></span>Vertex Autopost</a>
  <nav class="nav" id="nav"></nav>
  <div class="top-right">
    <button class="pill" id="autoBtn" data-act="toggle-auto"></button>
    <div class="avatar" id="me" title="Account"></div>
  </div>
</header>
<main class="main"><div id="view"></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Phase 2: Supabase keys yahan aayengi. Khali = demo mode (browser storage). */
const CONFIG = { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };
const KEY = 'vertex-autopost-v2';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WEEK = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); };
const uid = () => Math.random().toString(36).slice(2, 9);
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  tag:'<path d="M20.6 13.4L12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.2"/>',
  ig:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  up:'<path d="M18 15l-6-6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>', left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  hash:'<path d="M5 9h14M5 15h14M10 3L8 21M16 3l-2 18"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  text:'<path d="M4 6h16M4 12h10M4 18h13"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  menu:'<path d="M3 6h18M3 12h18M3 18h18"/>', download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  check:'<path d="M20 6L9 17l-5-5"/>'
};
const ic = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
function art(i){
  const hues=[[268,300],[215,260],[318,350],[170,205],[28,48],[288,320],[195,230],[248,278],[340,10]];
  const [a,b]=hues[i%hues.length];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${a},66%,60%)'/><stop offset='1' stop-color='hsl(${b},58%,32%)'/></linearGradient></defs><rect width='400' height='500' fill='url(#g)'/><circle cx='${90+(i*37)%220}' cy='${110+(i*53)%220}' r='${70+(i*13)%60}' fill='rgba(255,255,255,.17)'/><rect x='56' y='340' width='220' height='18' rx='9' fill='rgba(255,255,255,.6)'/><rect x='56' y='372' width='150' height='14' rx='7' fill='rgba(255,255,255,.3)'/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
function seed(){
  const day=86400000, now=Date.now();
  const caps=['','Naya design, naya vibe. Kaunsa colour pasand aaya?','Weekend plans sorted ☕','','Small details, big difference.','Studio mein aaj ka scene 👀','','Aapke ghar ke liye perfect corner?','Fresh drop. Link in bio.',''];
  const media=[];
  for(let i=1;i<=9;i++) media.push({id:'m'+i,n:i,src:art(i),status:i<=3?'posted':'queued',caption:caps[i]||'',approved:true,
    postedAt:i<=3?new Date(now-(4-i)*day).toISOString():null,likes:i<=3?Math.round(90+rnd(i)*260):0,comments:i<=3?Math.round(4+rnd(i+7)*30):0});
  const log=(d,level,msg)=>({id:uid(),t:new Date(now-d*day).toISOString(),level,msg});
  return {
    automation:true, aiCaptions:true, notify:true, email:'you@yourbrand.com',
    account:{name:'Shivam',brand:'Vertex',ig:'@_vertex.os_',connected:true,renewDays:52},
    setup:{ source:'Local folder', folder:'C:\\InstaPosts', order:'Number order (1, 2, 3…)', frequency:'Once a day',
      captionSource:'AI writes it from the image', language:'Hinglish', hashtagGroup:'g1', ratio:'4:5 (portrait)',
      approval:'Post automatically', onError:'Retry, then tell me', afterPost:'Keep the file in the folder', missed:'Post it as soon as the PC is on' },
    media, nextN:10,
    slots:{Mon:['10:00'],Tue:['10:00'],Wed:['10:00'],Thu:['10:00'],Fri:['10:00'],Sat:['10:00'],Sun:['10:00']},
    tz:'Asia/Kolkata',
    templates:[{id:'t1',name:'Everyday post',body:'New from {brand} ✨\n\nSwipe through and tell us your favourite.\n\n{hashtags}'},
      {id:'t2',name:'Offer',body:'Limited time at {brand} 🔥\nDM us before {date} to grab it.\n\n{hashtags}'},
      {id:'t3',name:'Behind the scenes',body:'A quick look behind the scenes at {brand}.\nWhat should we show next?\n\n{hashtags}'}],
    activeTpl:'t1', tplGroup:'g1',
    groups:[{id:'g1',name:'Brand',tags:['#vertexos','#smallbusinessindia','#madeinindia']},
      {id:'g2',name:'Furniture',tags:['#furnituredesign','#interiordesign','#homedecor','#sofadesign','#mumbaiinteriors']},
      {id:'g3',name:'Reach',tags:['#instagood','#explorepage','#trending']}],
    logs:[log(1,'ok','Published image #3 to @_vertex.os_'),log(1.01,'ok','Wrote a caption for image #3 from the image'),
      log(2,'ok','Published image #2 to @_vertex.os_'),log(2.02,'warn','Instagram was busy at 10:00. Retried and published at 10:30.'),
      log(3,'err','Skipped image #11: it is too tall (1:3). Crop it to 4:5 or 1:1 and add it again.'),
      log(3.01,'ok','Published image #1 to @_vertex.os_'),log(5,'ok','Instagram access renewed for 60 days')]
  };
}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.media&&s.setup) return s;}catch(e){} return seed();})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
const ui={libq:'',cat:'All',tab:'media',mfilter:'all',cal:0,range:30,lfilter:'all',q:''};
const queue=()=>S.media.filter(m=>m.status==='queued');
const posted=()=>S.media.filter(m=>m.status==='posted').sort((a,b)=>new Date(b.postedAt)-new Date(a.postedAt));
const byId=id=>S.media.find(m=>m.id===id);
function upcoming(k){const out=[],now=new Date();
  for(let d=0;d<400&&out.length<k;d++){const day=new Date(now);day.setDate(now.getDate()+d);
    for(const t of (S.slots[DAYS[day.getDay()]]||[]).slice().sort()){const [h,m]=t.split(':');const dt=new Date(day);dt.setHours(+h,+m,0,0);
      if(dt>now){out.push(dt);if(out.length>=k)break;}}}
  return out;}
const fmtDate=d=>d.toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const fmtDay=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function until(d){const m=Math.max(0,Math.round((d-Date.now())/60000)); if(m<60)return `in ${m}m`;
  const h=Math.floor(m/60); if(h<24)return `in ${h}h ${m%60}m`; return `in ${Math.floor(h/24)}d ${h%24}h`;}
function ago(t){const m=Math.round((Date.now()-new Date(t))/60000); if(m<1)return'just now'; if(m<60)return m+'m ago';
  const h=Math.round(m/60); if(h<24)return h+'h ago'; const d=Math.round(h/24); return d===1?'yesterday':d+' days ago';}
function addLog(level,msg){S.logs.unshift({id:uid(),t:new Date().toISOString(),level,msg});S.logs=S.logs.slice(0,300);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400);}
function commit(msg){ if(!save()) toast('Could not save. Browser storage is full.'); else if(msg) toast(msg); render(); }
function fill(body){const g=S.groups.find(x=>x.id===S.tplGroup),d=upcoming(1)[0];
  return body.replaceAll('{brand}',S.account.brand).replaceAll('{hashtags}',g?g.tags.join(' '):'').replaceAll('{date}',d?fmtDay(d):'Sunday');}
function setQueueOrder(ids){S.media=S.media.filter(m=>m.status!=='queued').concat(ids.map(byId));}
const tgl=(key,on,label)=>`<button class="tg" role="switch" aria-checked="${!!on}" aria-label="${esc(label)}" data-act="tg" data-key="${key}"></button>`;
const lvLabel={ok:'Done',warn:'Fixed itself',err:'Needs you'};
const initials=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
const chips=(...names)=>`<div class="chips">${names.map(n=>`<span class="ichip">${ic(n,18)}</span>`).join('')}</div>`;
/* dropdown helper */
const sel=(path,value,opts)=>`<select data-set="${path}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const optRow=(t,d,ctrl)=>`<div class="opt"><div><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div><div class="c">${ctrl}</div></div>`;

/* ---------- Views ---------- */
function vOverview(){
  const q=queue(), sl=upcoming(Math.max(q.length,1)), nxt=q[0], when=sl[0];
  const now=new Date(), month=posted().filter(m=>{const d=new Date(m.postedAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;
  const lastDay=q.length?upcoming(q.length)[q.length-1]:null;
  const perWeek=Object.values(S.slots).reduce((a,t)=>a+t.length,0);
  const errs=S.logs.filter(l=>l.level==='err').length;

  const hero = !S.account.connected
    ? `<div class="hero"><div>${chips('ig')}<h3>Instagram is disconnected</h3><p class="sub">Reconnect the account so posting can continue.</p><div class="hero-foot"><a class="btn primary" href="#/settings">Reconnect</a></div></div></div>`
    : !nxt
    ? `<div class="hero"><div>${chips('folder','upload')}<h3>Your queue is empty</h3><p class="sub">Drop images into your folder, or upload them here. They post in order.</p><div class="hero-foot"><a class="btn primary" href="#/content">${ic('upload',16)}Add images</a><a class="btn" href="#/automation">Open settings</a></div></div></div>`
    : `<div class="hero">
        <div>
          ${chips('bolt','pen','ig')}
          <h3>${S.automation&&when?'Next post goes live '+until(when):'Autoposting is paused'}</h3>
          <p class="sub">${when?fmtDate(when)+' · image #'+nxt.n+' · '+(nxt.caption?'your caption':S.setup.captionSource.toLowerCase()):'Turn autoposting back on to continue the queue.'}</p>
          <div class="hero-foot">
            ${S.automation?`<button class="btn primary" data-act="post-now">Post now</button><button class="btn" data-act="skip">Move to end</button>`:`<button class="btn primary" data-act="toggle-auto">Resume autoposting</button>`}
          </div>
          <div class="hero-foot"><span class="avatar">${esc(initials(S.account.brand))}</span>${esc(S.account.ig)} <span class="st ok">${S.automation?'Running':'Paused'}</span></div>
        </div>
        <div class="shot">
          <div class="ph"><img src="${nxt.src}" alt="Next post, image #${nxt.n}"></div>
          <div class="cap">${nxt.caption?esc(nxt.caption):'Caption will be written from this image when it goes live.'}</div>
          <div class="meta"><span>${esc(S.account.ig)}</span><span>${when?fmtDate(when):''}</span></div>
        </div>
      </div>`;

  // Har card = ek setting ya section. Search + category isi list ko filter karte hain.
  const CARDS=[
    {cat:'Content', icons:['list'], title:`${q.length} images waiting in the queue`, foot:lastDay?'Lasts until '+fmtDay(lastDay):'Add more images', href:'#/queue', k:'queue order drag sequence'},
    {cat:'Content', icons:['folder','gear'], title:'Posting straight from your folder', foot:S.setup.folder, href:'#/automation', k:'folder path source local drive upload'},
    {cat:'Content', icons:['upload','image'], title:'Upload and manage your images', foot:S.media.length+' images in the library', href:'#/content', k:'media library upload jpg png delete'},
    {cat:'Captions', icons:['pen','bolt'], title:'Captions written from each image', foot:S.setup.captionSource+' · '+S.setup.language, href:'#/automation', k:'caption ai template txt language tone'},
    {cat:'Captions', icons:['hash'], title:'Hashtag groups for every post', foot:S.groups.length+' groups saved', href:'#/content', k:'hashtag tags group 30'},
    {cat:'Schedule', icons:['cal','clock'], title:'Your weekly posting times', foot:perWeek+' posts a week · '+S.tz, href:'#/schedule', k:'schedule time slots calendar timezone recurring'},
    {cat:'Schedule', icons:['bolt'], title:'How often it posts', foot:S.setup.frequency, href:'#/automation', k:'frequency daily twice 30 minutes custom'},
    {cat:'Growth', icons:['chart'], title:`${month} posts published this month`, foot:'Reach, engagement and best times', href:'#/analytics', k:'analytics reach engagement followers insights'},
    {cat:'Health', icons:['shield','clock'], title:errs?`${errs} thing${errs>1?'s':''} ${errs>1?'need':'needs'} your attention`:'Everything ran without errors', foot:'Activity log', href:'#/logs', k:'errors logs failed retry activity'},
    {cat:'Account', icons:['ig'], title:'Instagram account and access', foot:S.account.ig+' · '+(S.account.connected?'connected':'disconnected'), href:'#/settings', k:'instagram account token connect disconnect login'},
    {cat:'Health', icons:['gear'], title:'Approve each post before it goes live', foot:S.approval?'On':'Off — posts go out automatically', href:'#/automation', k:'approval review safety manual check'},
    {cat:'Account', icons:['text'], title:'Emails when something needs you', foot:S.notify?'On · '+S.email:'Off', href:'#/settings', k:'email notifications alerts'}
  ];
  const cats=['All','Content','Captions','Schedule','Growth','Health','Account'];
  const term=ui.libq.trim().toLowerCase();
  const list=CARDS.filter(c=>(ui.cat==='All'||c.cat===ui.cat)&&(!term||(c.title+' '+c.foot+' '+c.k+' '+c.cat).toLowerCase().includes(term)));

  return `
  <section class="libhero">
    <h1>Your Instagram <span class="dim">runs on autopilot</span></h1>
    <p class="lead" style="text-align:center">${q.length} images ready${when&&S.automation?', next one goes live '+until(when):''}. Change any part of it below.</p>
    <div class="search">
      <span class="tagchip">${ic('bolt',13)} ${esc(S.account.ig)}</span>
      <input id="libSearch" value="${esc(ui.libq)}" placeholder="Search settings, images, hashtags, activity…" aria-label="Search the dashboard">
      <span class="go">${ic('search',18)}</span>
    </div>
    <div class="cats">${cats.map(c=>`<button aria-selected="${ui.cat===c}" data-act="cat" data-v="${c}">${c}</button>`).join('')}</div>
  </section>
  ${term||ui.cat!=='All'?'':hero}
  <div class="sec">${term?'Matches':'Everything you can change'} <span class="dim">${list.length} card${list.length===1?'':'s'}</span></div>
  ${list.length?`<div class="cardgrid">${list.map(c=>`
    <a class="card link" href="${c.href}">
      ${chips(...c.icons)}
      <h3>${esc(c.title)}</h3>
      <div class="foot">${ic('right',14)} <span class="ell">${esc(c.foot)}</span></div>
    </a>`).join('')}</div>`
  :`<div class="card" style="text-align:center;padding:40px"><p class="muted">Nothing matches “${esc(ui.libq)}”.</p><button class="btn" style="margin-top:14px" data-act="clear-search">Clear search</button></div>`}
  <div class="sec">This week <span class="dim">schedule and activity</span></div>
  <div class="grid2">
    <section class="card"><div class="card-head"><h2>Next 7 days</h2><a class="btn sm ghost" href="#/schedule">Edit schedule</a></div>
      <div class="week">${[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);
        const sc=(S.automation?upcoming(q.length):[]).filter(x=>x.toDateString()===d.toDateString()).length;
        const pc=posted().filter(m=>new Date(m.postedAt).toDateString()===d.toDateString()).length;
        return `<div class="day ${i===0?'today':''}"><small>${DAYS[d.getDay()]}</small><span class="num">${d.getDate()}</span><div class="dots">${'<i class="dot p"></i>'.repeat(pc)}${'<i class="dot"></i>'.repeat(sc)}</div></div>`}).join('')}</div>
      <div class="legend"><span><i class="dot"></i>Scheduled</span><span><i class="dot p"></i>Published</span></div>
    </section>
    <section class="card"><div class="card-head"><h2>Recent activity</h2><a class="btn sm ghost" href="#/logs">See all</a></div>
      <ul class="feed">${S.logs.slice(0,5).map(l=>`<li><span class="lv ${l.level}"></span><span>${esc(l.msg)}</span><time>${ago(l.t)}</time></li>`).join('')}</ul>
    </section>
  </div>`;
}

function vAutomation(){
  const s=S.setup;
  return `

function vSchedule(){
  const perWeek=Object.values(S.slots).reduce((a,t)=>a+t.length,0);
  const rows=WEEK.map(d=>`<div class="srow"><b class="muted">${d}</b><div class="times">
    ${(S.slots[d]||[]).slice().sort().map(t=>`<span class="chip num">${t}<button data-act="slot-del" data-day="${d}" data-t="${t}" aria-label="Remove ${t}">${ic('x',13)}</button></span>`).join('')}
    <span class="add-time"><input type="time" data-day-input="${d}" aria-label="New time on ${d}"><button class="btn sm icon" data-act="slot-add" data-day="${d}" aria-label="Add time">${ic('plus',15)}</button></span></div></div>`).join('');
  const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+ui.cal);
  const month=base.getMonth(),start=new Date(base);start.setDate(1-((base.getDay()+6)%7));
  const q=queue(),sl=S.automation?upcoming(q.length):[],ev={},key=d=>d.toDateString();
  q.forEach((m,i)=>{if(sl[i])(ev[key(sl[i])]||=[]).push({m,p:false})});
  posted().forEach(m=>(ev[key(new Date(m.postedAt))]||=[]).push({m,p:true}));
  const today=new Date().toDateString();
  const cells=[...Array(42)].map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const e=ev[key(d)]||[];
    return `<div class="cell ${d.getMonth()!==month?'out':''} ${key(d)===today?'today':''}"><span class="num">${d.getDate()}</span>
      ${e[0]?`<img class="${e[0].p?'p':''}" src="${e[0].m.src}" alt="Image #${e[0].m.n}">`:''}${e.length>1?`<div class="more">+${e.length-1}</div>`:''}</div>`}).join('');
  return `<div class="page-head"><div><h1>Schedule <span class="dim">your time slots</span></h1><p class="lead">The queue fills these slots in order.</p></div>
    <div style="min-width:230px">${sel('setup.frequency',S.setup.frequency,['Once a day','Twice a day','Three times a day','Every 30 minutes','Weekdays only','Custom (set in Schedule)'])}</div></div>
  <div class="grid2" style="margin-top:0">
    <section class="card"><div class="card-head"><h2>Weekly time slots</h2><span class="hint">${perWeek} posts a week</span></div>${rows}</section>
    <section class="card"><div class="card-head"><h2>${base.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2>
      <span class="ctl"><button class="btn icon" data-act="cal" data-v="-1" aria-label="Previous month">${ic('left',16)}</button><button class="btn icon" data-act="cal" data-v="1" aria-label="Next month">${ic('right',16)}</button></span></div>
      <div class="cal">${WEEK.map(d=>`<div class="h">${d}</div>`).join('')}${cells}</div>
      <div class="legend"><span>Faded image = already published</span></div></section>
  </div>`;
}

function vAnalytics(){
  const n=ui.range===90?45:ui.range;
  const vals=[...Array(n)].map((_,i)=>Math.round(700+i*(900/n)+rnd(i+ui.range)*650));
  const reach=vals.reduce((a,b)=>a+b,0), likes=Math.round(reach*.061), comments=Math.round(reach*.006);
  const er=((likes+comments)/reach*100).toFixed(1), followers=Math.round(ui.range*4.3+rnd(ui.range)*40);
  const kpis=[['Reach',reach.toLocaleString('en-IN'),'+12%'],['Engagement rate',er+'%','+0.4%'],['Likes',likes.toLocaleString('en-IN'),'+9%'],['Comments',comments.toLocaleString('en-IN'),'-3%'],['New followers','+'+followers,'+18%']];
  const w=640,h=220,p=6,max=Math.max(...vals)*1.1;
  const X=i=>p+i*(w-2*p)/(vals.length-1), Y=v=>h-p-v/max*(h-2*p);
  const line='M'+vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
  const grid=[.25,.5,.75].map(f=>`<line x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" stroke="rgba(255,255,255,.07)"/>`).join('');
  const d0=new Date();d0.setDate(d0.getDate()-ui.range);
  const hours=[...Array(15)].map((_,i)=>25+rnd(i*3+1)*60+(i===11?30:0));
  const best=hours.indexOf(Math.max(...hours)), label=h=>{const x=8+h;return (x%12||12)+(x<12?' am':' pm')};
  const top=posted().slice().sort((a,b)=>b.likes-a.likes).slice(0,4);
  return `<div class="page-head"><div><h1>Analytics <span class="dim">what is working</span></h1></div>
    <div class="seg">${[7,30,90].map(r=>`<button aria-selected="${ui.range===r}" data-act="range" data-v="${r}">${r} days</button>`).join('')}</div></div>
  <div class="banner info"><span>Sample numbers for now. Real reach appears once Instagram insights are connected.</span></div>
  <div class="kpis">${kpis.map(([k,v,d])=>`<div class="kpi"><div class="k">${k}</div><div class="v num">${v}</div><div class="d ${d.startsWith('-')?'neg':''}">${d}</div></div>`).join('')}</div>
  <div class="an">
    <section class="card"><div class="card-head"><h2>Reach</h2><span class="hint">Accounts that saw your posts</span></div>
      <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Reach over ${ui.range} days">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A855F7" stop-opacity=".35"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></linearGradient></defs>
        ${grid}<path d="${line} L${X(vals.length-1)},${h} L${X(0)},${h} Z" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#D8B4FE" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="axis"><span>${fmtDay(d0)}</span><span>Today</span></div></section>
    <div>
      <section class="card" style="margin-bottom:18px"><div class="card-head"><h2>Best time to post</h2></div>
        <div class="hours">${hours.map((v,i)=>`<div class="${i===best?'best':''}" style="height:${v}%" title="${label(i)}"></div>`).join('')}</div>
        <div class="axis"><span>8 am</span><span>3 pm</span><span>10 pm</span></div>
        <p class="hint" style="margin-top:12px">Your audience is most active around ${label(best)}.</p></section>
      <section class="card"><div class="card-head"><h2>Top posts</h2></div>
        ${top.map(m=>`<div class="tp"><img src="${m.src}" alt="Image #${m.n}"><div><div>Image #${m.n}</div><div class="hint">${fmtDay(new Date(m.postedAt))}</div></div><div class="num" style="text-align:right">${m.likes} likes<div class="hint">${m.comments} comments</div></div></div>`).join('')||'<p class="hint">Publish a few posts first.</p>'}</section>
    </div></div>`;
}

const VIEWS={overview:vOverview,automation:vAutomation,content:vContent,queue:vQueue,schedule:vSchedule,analytics:vAnalytics,logs:vLogs,settings:vSettings};
const NAV=[['overview','Overview','home'],['automation','Automation','bolt'],['content','Content','image'],['queue','Queue','list'],['schedule','Schedule','cal'],['analytics','Analytics','chart'],['logs','Activity','alert'],['settings','Settings','gear']];
function render(){
  const raw=location.hash.replace('#/',''), r=VIEWS[raw]?raw:'overview';
  const errs=S.logs.filter(l=>l.level==='err').length;
  $('#nav').innerHTML=NAV.map(([id,label,icon])=>{let c='';
    if(id==='queue')c=`<span class="count num">${queue().length}</span>`;
    if(id==='logs'&&errs)c=`<span class="count err num">${errs}</span>`;
    return `<a href="#/${id}" ${id===r?'aria-current="page"':''}>${ic(icon)}<span>${label}</span>${c}</a>`}).join('');
  const ab=$('#autoBtn');ab.setAttribute('aria-pressed',S.automation);ab.innerHTML=`<span class="led"></span>${S.automation?'Running':'Paused'}`;
  $('#me').textContent=initials(S.account.name);
  $('#view').innerHTML=VIEWS[r]();
  document.title=NAV.find(n=>n[0]===r)[1]+' · Vertex Autopost';
  document.body.classList.remove('nav-open');
}
/* frequency dropdown -> slots */
function applyFrequency(v){
  const set=t=>{WEEK.forEach(d=>S.slots[d]=t.slice())};
  if(v==='Once a day')set(['10:00']);
  if(v==='Twice a day')set(['10:00','18:30']);
  if(v==='Three times a day')set(['09:00','14:00','19:30']);
  if(v==='Every 30 minutes')set([...Array(28)].map((_,i)=>{const m=600+i*30;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}));
  if(v==='Weekdays only'){WEEK.forEach(d=>S.slots[d]=['Sat','Sun'].includes(d)?[]:['10:00'])}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v,q=queue();
  switch(a){
    case 'menu-open':document.body.classList.add('nav-open');break;
    case 'menu-close':document.body.classList.remove('nav-open');break;
    case 'toggle-auto':S.automation=!S.automation;addLog('ok',S.automation?'Autoposting resumed':'Autoposting paused');commit(S.automation?'Autoposting resumed':'Autoposting paused');break;
    case 'tg':{const k=el.dataset.key;S[k]=!S[k];commit('Saved');break}
    case 'post-now':{const m=q[0];if(!m)break;m.status='posted';m.postedAt=new Date().toISOString();m.likes=0;m.comments=0;addLog('ok',`Published image #${m.n} to ${S.account.ig}`);commit('Published');break}
    case 'skip':{if(q.length<2){toast('Only one post in the queue');break}const ids=q.map(m=>m.id);ids.push(ids.shift());setQueueOrder(ids);commit('Moved to the end');break}
    case 'q-up':case 'q-down':{const ids=q.map(m=>m.id),i=ids.indexOf(id),j=a==='q-up'?i-1:i+1;if(j<0||j>=ids.length)break;[ids[i],ids[j]]=[ids[j],ids[i]];setQueueOrder(ids);commit();break}
    case 'del-media':{const m=byId(id);if(!m||!confirm(`Delete image #${m.n}?`))break;S.media=S.media.filter(x=>x.id!==id);commit('Deleted');break}
    case 'test-folder':{const n=queue().length;toast(`${S.setup.folder} — ${n} image${n===1?'':'s'} ready to post`);break}
    case 'tab':ui.tab=v;render();break;
    case 'mfilter':ui.mfilter=v;render();break;
    case 'tpl':S.activeTpl=id;commit();break;
    case 'tpl-new':{const t={id:uid(),name:'New template',body:'{brand}\n\n{hashtags}'};S.templates.push(t);S.activeTpl=t.id;commit('Template added');break}
    case 'tpl-save':{const t=S.templates.find(x=>x.id===S.activeTpl);if(!t)break;t.name=$('#tplName').value.trim()||'Untitled';t.body=$('#tplBody').value;commit('Template saved');break}
    case 'tpl-del':{if(S.templates.length<2){toast('Keep at least one template');break}if(!confirm('Delete this template?'))break;S.templates=S.templates.filter(x=>x.id!==S.activeTpl);S.activeTpl=S.templates[0].id;commit('Deleted');break}
    case 'ins':{const ta=$('#tplBody'),s=ta.selectionStart;ta.value=ta.value.slice(0,s)+v+ta.value.slice(ta.selectionEnd);ta.focus();ta.selectionStart=ta.selectionEnd=s+v.length;$('#tplPreview').textContent=fill(ta.value);break}
    case 'tag-del':{S.groups.find(x=>x.id===el.dataset.g).tags.splice(+el.dataset.i,1);commit();break}
    case 'group-new':S.groups.push({id:uid(),name:'New group',tags:[]});commit('Group added');break;
    case 'group-del':{if(!confirm('Delete this group?'))break;S.groups=S.groups.filter(x=>x.id!==el.dataset.g);if(!S.groups.find(g=>g.id===S.tplGroup))S.tplGroup=S.groups[0]?.id;commit('Deleted');break}
    case 'slot-add':{const d=el.dataset.day,inp=document.querySelector(`[data-day-input="${d}"]`),t=inp.value;if(!t){inp.focus();toast('Pick a time first');break}
      S.slots[d]=[...new Set([...(S.slots[d]||[]),t])];S.setup.frequency='Custom (set in Schedule)';commit(`Added ${t} on ${d}`);break}
    case 'slot-del':{const d=el.dataset.day;S.slots[d]=S.slots[d].filter(t=>t!==el.dataset.t);S.setup.frequency='Custom (set in Schedule)';commit('Time removed');break}
    case 'cal':ui.cal+=+v;render();break;
    case 'range':ui.range=+v;render();break;
    case 'lfilter':ui.lfilter=v;render();break;
    case 'csv':{const rows=[['time','status','message'],...S.logs.map(l=>[l.t,lvLabel[l.level],l.msg])];
      const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
      const aEl=document.createElement('a');aEl.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));aEl.download='activity-log.csv';aEl.click();break}
    case 'ig-toggle':S.account.connected=!S.account.connected;addLog(S.account.connected?'ok':'warn',(S.account.connected?'Reconnected ':'Disconnected ')+S.account.ig);commit(S.account.connected?'Reconnected':'Disconnected');break;
    case 'check-path': {
      const v = document.querySelector('[data-setup="folder"]').value.trim();
      S.setup.folder = v; save();
      toast(v ? `Watching ${v}` : 'Add a folder path first');
      addLog('ok', `Folder set to ${v}`); break;
    }
    case 'cat': ui.cat=v; render(); break;
    case 'clear-search': ui.libq=''; ui.cat='All'; render(); break;
    case 'reset':if(confirm('Reset all demo data?')){S=seed();commit('Demo data restored')}break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='tplBody')$('#tplPreview').textContent=fill(e.target.value);
  if(e.target.id==='libSearch'){ui.libq=e.target.value;const pos=e.target.selectionStart;render();const el=$('#libSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}
  if(e.target.id==='logSearch'){ui.q=e.target.value;$('#logBody').innerHTML=logRows()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){
    const path=t.dataset.set.split('.');let o=S;while(path.length>1)o=o[path.shift()];
    o[path[0]]=t.value;
    if(t.dataset.set==='setup.frequency')applyFrequency(t.value);
    if(t.dataset.set==='setup.hashtagGroup')S.tplGroup=t.value;
    commit('Saved');
  }
  if(t.id==='tplGroup'){S.tplGroup=t.value;save();$('#tplPreview').textContent=fill($('#tplBody').value)}
  if(t.dataset.groupName){S.groups.find(g=>g.id===t.dataset.groupName).name=t.value.trim()||'Untitled';commit('Saved')}
  if(t.id==='file')addFiles([...t.files]);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.dataset.tagInput){e.preventDefault();
    const g=S.groups.find(x=>x.id===t.dataset.tagInput);
    const tags=t.value.split(/[\s,]+/).filter(Boolean).map(x=>'#'+x.replace(/^#+/,'').toLowerCase());
    const next=[...new Set([...g.tags,...tags])];
    if(next.length>30){toast('A post can have at most 30 hashtags');return}
    g.tags=next;commit();document.querySelector(`[data-tag-input="${g.id}"]`)?.focus();}
  if(e.key==='Escape')document.body.classList.remove('nav-open');
});
let dragId=null;
document.addEventListener('dragstart',e=>{const li=e.target.closest?.('[data-qid]');if(!li)return;dragId=li.dataset.qid;li.classList.add('dragging')});
document.addEventListener('dragend',e=>{e.target.closest?.('[data-qid]')?.classList.remove('dragging');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const li=e.target.closest?.('[data-qid]'),d=e.target.closest?.('#drop');
  if(li&&dragId){e.preventDefault();document.querySelectorAll('.ql .over').forEach(x=>x.classList.remove('over'));li.classList.add('over')}
  if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('#drop')?.classList.remove('over')});
document.addEventListener('drop',e=>{const li=e.target.closest?.('[data-qid]'),d=e.target.closest?.('#drop');
  if(li&&dragId){e.preventDefault();const ids=queue().map(m=>m.id).filter(x=>x!==dragId);ids.splice(ids.indexOf(li.dataset.qid),0,dragId);setQueueOrder(ids);dragId=null;commit('Queue updated')}
  if(d){e.preventDefault();d.classList.remove('over');addFiles([...e.dataTransfer.files].filter(f=>/image\/(jpeg|png)/.test(f.type)))}});
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1080/img.width),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=rej;img.src=url})}
async function addFiles(files){
  if(!files.length)return;
  const before=JSON.stringify(S.media),nBefore=S.nextN;
  for(const f of files){
    try{S.media.push({id:uid(),n:S.nextN++,src:await shrink(f),status:'queued',caption:'',approved:true,postedAt:null,likes:0,comments:0})}
    catch(e){addLog('err',`Could not read ${f.name}. Use a JPG or PNG.`)}}
  if(!save()){S.media=JSON.parse(before);S.nextN=nBefore;toast('Browser storage is full. Delete a few images first.');render();return}
  addLog('ok',`Added ${files.length} image${files.length>1?'s':''} to the queue`);commit(`${files.length} added to the queue`);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
