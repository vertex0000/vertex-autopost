<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex Autopost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A; --surface:#1E293B; --glass:rgba(30,41,59,.62);
  --line:rgba(148,163,184,.14); --line2:rgba(148,163,184,.24);
  --text:#E2E8F0; --muted:#94A3B8; --faint:#64748B;
  --primary:#6366F1; --primary-2:#8B5CF6;
  --ok:#34D399; --warn:#FBBF24; --err:#F87171;
  --r-lg:16px; --r-md:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 'Onest',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(640px 420px at 88% -8%,rgba(99,102,241,.16),transparent 60%),
             radial-gradient(520px 420px at 6% 108%,rgba(139,92,246,.12),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-2);outline-offset:2px;border-radius:6px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:650}
h2{font-size:15px;font-weight:600;margin:0}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.hint{color:var(--faint);font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Layout */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);
  background:rgba(15,23,42,.55);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:700;font-size:17px;letter-spacing:-.01em;text-decoration:none}
.mark{width:30px;height:30px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:#fff}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--text);background:rgba(148,163,184,.07)}
.nav a[aria-current=page]{color:var(--text);background:rgba(99,102,241,.14);box-shadow:inset 2px 0 0 var(--primary)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint)}
.nav .count.err{color:var(--err)}
.acct{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;gap:10px;align-items:center;font-size:13px}
.acct .avatar{flex:none}
.main{padding:20px 36px 64px;max-width:1260px;width:100%}
.top{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:26px;min-height:40px}
.top .menu-btn,.scrim{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}

/* Pieces */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(14px);padding:22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);
  background:transparent;font-weight:550;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:rgba(148,163,184,.08)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#585CEB}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--err);border-color:rgba(248,113,113,.35)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.icon{width:32px;height:32px;padding:0}
.btn:disabled{opacity:.4;cursor:default}
.pill{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:var(--glass);cursor:pointer;font-weight:550;font-size:14px}
.led{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill[aria-pressed=true] .led{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.tg{position:relative;flex:none;width:42px;height:24px;border-radius:99px;background:#334155;border:0;cursor:pointer;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked=true]{background:var(--primary)}
.tg[aria-checked=true]::after{transform:translateX(18px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(148,163,184,.1);font-size:13px}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:var(--faint);display:grid}
.chip button:hover{color:var(--text)}
.st{display:inline-block;font-size:12px;font-weight:550;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.q{background:rgba(99,102,241,.18);color:#A5B4FC}
.st.p,.st.ok{background:rgba(52,211,153,.14);color:#6EE7B7}
.st.warn{background:rgba(251,191,36,.14);color:#FCD34D}
.st.err{background:rgba(248,113,113,.14);color:#FCA5A5}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#FDE68A;font-size:14px;margin-bottom:16px}
.banner.info{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.3);color:#C7D2FE}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}
input,textarea,select{color-scheme:dark;width:100%;background:rgba(15,23,42,.6);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(15,23,42,.35)}
.seg button{height:32px;padding:0 12px;border-radius:8px;border:0;background:none;color:var(--muted);font-weight:550;font-size:14px;cursor:pointer}
.seg button[aria-selected=true]{background:rgba(148,163,184,.14);color:var(--text)}

/* Overview */
.ov{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.stack{display:grid;gap:20px;align-content:start}
.next-body{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.phone{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#0B1222}
.phone-top{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;font-weight:600}
.phone-top .avatar{width:24px;height:24px;font-size:10px}
.phone img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.phone-cap{padding:10px 12px 12px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.when{font-size:clamp(34px,3.4vw,44px);white-space:nowrap;font-weight:650;letter-spacing:-.035em;line-height:1;margin:6px 0 8px}
.when-sub{color:var(--muted)}
.facts{margin:22px 0;display:grid;gap:10px}
.facts div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted)} .facts dd{margin:0;text-align:right}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.rows .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.rows .row:first-child{border-top:0;padding-top:0}
.rows .k{color:var(--muted)} .rows .v{font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{padding:10px 4px;border-radius:10px;text-align:center;background:rgba(148,163,184,.05);font-size:13px}
.day.today{box-shadow:inset 0 0 0 1px rgba(99,102,241,.55)}
.day small{display:block;color:var(--faint);font-size:12px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.dot.p{background:var(--ok)}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0;padding-top:0}
.feed .lv{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.lv.ok{background:var(--ok)} .lv.warn{background:var(--warn)} .lv.err{background:var(--err)}
.feed time{margin-left:auto;color:var(--faint);font-size:12px;white-space:nowrap}
.span-all{grid-column:1/-1}

/* Content */
.drop{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:14px;cursor:pointer;margin-bottom:20px;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--primary);background:rgba(99,102,241,.06)}
.drop .ico{width:42px;height:42px;border-radius:12px;background:rgba(99,102,241,.14);color:#A5B4FC;display:grid;place-items:center;flex:none}
.drop .grow{flex:1}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0B1222}
.tile img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.tile.posted img{opacity:.5}
.tile .no{position:absolute;top:8px;left:8px;background:rgba(15,23,42,.78);backdrop-filter:blur(6px);font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.tile .st{position:absolute;bottom:8px;left:8px;background:rgba(15,23,42,.82);backdrop-filter:blur(6px)}
.tile .del{position:absolute;top:6px;right:6px;opacity:0;background:rgba(15,23,42,.8);border-color:transparent}
.tile:hover .del,.tile:focus-within .del{opacity:1}
.ce{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,.9fr);gap:20px;align-items:start}
.tpl-list{display:grid;gap:2px}
.tpl-list button{text-align:left;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer}
.tpl-list button:hover{color:var(--text)}
.tpl-list button[aria-current=true]{background:rgba(148,163,184,.1);color:var(--text)}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.vars button{border:1px dashed var(--line2);background:none;border-radius:8px;padding:4px 8px;font-size:13px;color:#A5B4FC;cursor:pointer}
.preview{white-space:pre-wrap;background:rgba(15,23,42,.5);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;color:#CBD5E1;min-height:150px}
.ai-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

/* Queue */
.ql{list-style:none;margin:0;padding:0}
.ql li{display:grid;grid-template-columns:20px 26px 56px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px;border-top:1px solid var(--line)}
.ql li:first-child{border-top-color:transparent}
.ql li.dragging{opacity:.35}
.ql li.over{background:rgba(99,102,241,.1)}
.ql .grip{color:var(--faint);cursor:grab;display:grid}
.ql .seq{color:var(--faint);font-weight:600;text-align:center}
.ql img{width:56px;height:70px;object-fit:cover;border-radius:8px;display:block}
.ql .cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ql .cap.ai{color:var(--muted)}
.ql .ctl{display:flex;gap:4px}

/* Schedule */
.sch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.srow{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow b{font-weight:600;color:var(--muted)}
.times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.add-time{display:inline-flex;gap:6px;align-items:center}
.add-time input{width:118px;padding:6px 8px;height:32px}
.sch-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:16px;margin-top:4px;border-top:1px solid var(--line);flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--faint);text-align:center;padding-bottom:4px}
.cell{min-height:82px;border-radius:10px;background:rgba(148,163,184,.05);padding:6px;font-size:12px;position:relative;overflow:hidden}
.cell.out{opacity:.3}
.cell.today{box-shadow:inset 0 0 0 1px var(--primary)}
.cell img{width:100%;height:46px;object-fit:cover;border-radius:6px;margin-top:4px;display:block}
.cell img.p{opacity:.55}
.cell .more{font-size:11px;color:var(--muted)}

/* Analytics */
.note{margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(14px)}
.kpi{padding:18px 20px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ok)}
.kpi .d.neg{color:var(--err)}
.an{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.chart{width:100%;height:230px;display:block}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:8px}
.hours{display:flex;align-items:flex-end;gap:5px;height:130px}
.hours div{flex:1;border-radius:5px 5px 2px 2px;background:rgba(99,102,241,.3)}
.hours div.best{background:var(--primary)}
.top-posts{display:grid;gap:12px}
.tp{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.tp img{width:48px;height:60px;object-fit:cover;border-radius:8px}

/* Logs */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--faint);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .t{white-space:nowrap;color:var(--muted)}
.log-tools{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.log-tools input{max-width:280px}

/* Settings */
.set{display:grid;gap:20px;max-width:780px}
.sr{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-top:1px solid var(--line)}
.sr:first-of-type{border-top:0;padding-top:4px}
.sr .t{font-weight:550}
.sr .d{font-size:13px;color:var(--muted);max-width:52ch}
.sr .ctrl{flex:none;display:flex;gap:8px;align-items:center}
.sr .ctrl input,.sr .ctrl select{width:230px}

#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  background:var(--surface);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:60;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .ce{grid-template-columns:200px minmax(0,1fr)}
  .ce .prev-col{grid-column:2}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:266px;transform:translateX(-100%);transition:transform .25s;z-index:50;background:#0F172A}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:40}
  .main{padding:14px 16px 64px}
  .top{justify-content:space-between;margin-bottom:18px}
  .top .menu-btn{display:inline-flex}
  h1{font-size:24px}
  .ov,.an,.sch,.ce,.next-body{grid-template-columns:1fr}
  .ce .prev-col{grid-column:auto}
  .next-body .phone{max-width:300px}
  .when{font-size:38px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-left:0;border-top:1px solid var(--line)}
  .kpi:nth-child(even){border-left:1px solid var(--line)}
  .kpi:nth-child(-n+2){border-top:0}
  .ql li{grid-template-columns:22px 52px minmax(0,1fr) auto;gap:10px}
  .ql .grip,.ql .when-col{display:none}
  .ql img{width:52px;height:65px}
  .tile .del{opacity:1}
  .sr{flex-direction:column;align-items:flex-start}
  .sr .ctrl input,.sr .ctrl select{width:100%}
  .sr .ctrl{width:100%}
  .cell{min-height:58px}
  .cell img{height:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main">
    <a class="brand" href="#/overview">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l8 14 8-14"/></svg></span>
      Vertex Autopost
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="acct" id="acct"></div>
  </aside>
  <div class="scrim" data-act="menu-close"></div>
  <main class="main">
    <div class="top">
      <button class="btn icon menu-btn" data-act="menu-open" aria-label="Open menu"></button>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="pill" id="autoBtn" data-act="toggle-auto"></button>
        <div class="avatar" id="me" title="Your account"></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIG — Phase 2 mein Supabase keys yahan aayengi.
   Khali rahega toh dashboard "demo mode" mein browser mein
   data save karta hai (localStorage).
   ========================================================= */
const CONFIG = { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };
const KEY = 'vertex-autopost-v1';
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); };
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- Icons ---------- */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',

/* ---------- Helpers ---------- */
const queue = () => S.media.filter(m => m.status === 'queued');
const posted = () => S.media.filter(m => m.status === 'posted').sort((a, b) => new Date(b.postedAt) - new Date(a.postedAt));
const byId = id => S.media.find(m => m.id === id);
function upcoming(k) {
  const out = [], now = new Date();
  for (let d = 0; d < 400 && out.length < k; d++) {
    const day = new Date(now); day.setDate(now.getDate() + d);
    const times = (S.slots[DAYS[day.getDay()]] || []).slice().sort();
    for (const t of times) {
      const [h, m] = t.split(':'); const dt = new Date(day); dt.setHours(+h, +m, 0, 0);
      if (dt > now) { out.push(dt); if (out.length >= k) break; }
    }
  }
  return out;
}
const fmtDate = d => d.toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const fmtDay = d => d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
function until(d) {
  const m = Math.max(0, Math.round((d - Date.now()) / 60000));
  if (m < 60) return `in ${m}m`;
  const h = Math.floor(m / 60); if (h < 24) return `in ${h}h ${m % 60}m`;
  return `in ${Math.floor(h / 24)}d ${h % 24}h`;
}
function ago(t) {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : `${d} days ago`;
}
function addLog(level, msg) { S.logs.unshift({ id: uid(), t: new Date().toISOString(), level, msg }); S.logs = S.logs.slice(0, 300); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }
function commit(msg) { if (!save()) toast('Could not save. Browser storage is full, remove a few images.'); else if (msg) toast(msg); render(); }
function fill(body) {
  const g = S.groups.find(x => x.id === S.tplGroup); const d = upcoming(1)[0];
  return body.replaceAll('{brand}', S.account.brand).replaceAll('{hashtags}', g ? g.tags.join(' ') : '').replaceAll('{date}', d ? fmtDay(d) : 'Sunday');
}

    return `<div class="cell ${d.getMonth() !== month ? 'out' : ''} ${key(d) === today ? 'today' : ''}">
      <span class="num">${d.getDate()}</span>
      ${e[0] ? `<img class="${e[0].p ? 'p' : ''}" src="${e[0].m.src}" alt="Image #${e[0].m.n}">` : ''}
      ${e.length > 1 ? `<div class="more">+${e.length - 1} more</div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="page-head"><div><h1>Schedule</h1><p class="lead">Pick the times you want to post. The queue fills these slots in order.</p></div></div>
  <div class="sch">
    <section class="panel">
      <div class="panel-head"><h2>Weekly time slots</h2><span class="hint">${perWeek} posts a week</span></div>
      ${rows}
      <div class="sch-foot">
        <label class="hint" for="tz">Time zone</label>
        <select id="tz" style="max-width:240px">${['Asia/Kolkata', 'Asia/Dubai', 'Europe/London', 'America/New_York', 'Asia/Singapore'].map(z => `<option ${z === S.tz ? 'selected' : ''}>${z}</option>`).join('')}</select>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>${base.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</h2>
        <span class="actions"><button class="btn icon" data-act="cal" data-v="-1" aria-label="Previous month">${ic('left', 16)}</button><button class="btn icon" data-act="cal" data-v="1" aria-label="Next month">${ic('right', 16)}</button></span>
      </div>
      <div class="cal">${WEEK.map(d => `<div class="h">${d}</div>`).join('')}${cells}</div>
      <div class="legend"><span>Faded image = already published</span></div>
    </section>
  </div>`;
}

function vAnalytics() {
  const n = ui.range === 90 ? 45 : ui.range;
  const vals = [...Array(n)].map((_, i) => Math.round(700 + i * (900 / n) + rnd(i + ui.range) * 650));
  const reach = vals.reduce((a, b) => a + b, 0);
  const likes = Math.round(reach * 0.061), comments = Math.round(reach * 0.006), er = ((likes + comments) / reach * 100).toFixed(1);
  const followers = Math.round(ui.range * 4.3 + rnd(ui.range) * 40);
  const kpis = [['Reach', reach.toLocaleString('en-IN'), '+12%'], ['Engagement rate', er + '%', '+0.4%'], ['Likes', likes.toLocaleString('en-IN'), '+9%'], ['Comments', comments.toLocaleString('en-IN'), '-3%'], ['New followers', '+' + followers, '+18%']];
  const w = 640, h = 220, p = 6, max = Math.max(...vals) * 1.1;
  const X = i => p + i * (w - 2 * p) / (vals.length - 1), Y = v => h - p - v / max * (h - 2 * p);
  const line = 'M' + vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="rgba(148,163,184,.12)"/>`).join('');
  const d0 = new Date(); d0.setDate(d0.getDate() - ui.range);
  const hours = [...Array(15)].map((_, i) => 25 + rnd(i * 3 + 1) * 60 + (i === 11 ? 30 : 0));
  const best = hours.indexOf(Math.max(...hours));
  const bestLabel = h => { const x = 8 + h; return (x % 12 || 12) + (x < 12 ? ' am' : ' pm'); };
  const top = posted().slice().sort((a, b) => b.likes - a.likes).slice(0, 4);
  const seg = [7, 30, 90].map(r => `<button aria-selected="${ui.range === r}" data-act="range" data-v="${r}">${r} days</button>`).join('');
  return `
  <div class="page-head"><div><h1>Analytics</h1><p class="lead">How your posts are doing.</p></div><div class="seg">${seg}</div></div>
  <div class="banner info note"><span>These are sample numbers. Real reach and engagement appear here once Instagram insights are connected.</span></div>
  <div class="kpis">${kpis.map(([k, v, d]) => `<div class="kpi"><div class="k">${k}</div><div class="v num">${v}</div><div class="d ${d.startsWith('-') ? 'neg' : ''}">${d} vs previous ${ui.range} days</div></div>`).join('')}</div>
  <div class="an">
    <section class="panel"><div class="panel-head"><h2>Reach</h2><span class="hint">Accounts that saw your posts each day</span></div>
      <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Reach over the last ${ui.range} days">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366F1" stop-opacity=".32"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient></defs>
        ${grid}<path d="${line} L${X(vals.length - 1)},${h} L${X(0)},${h} Z" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#818CF8" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="axis"><span>${fmtDay(d0)}</span><span>Today</span></div>
    </section>
    <div class="stack">
      <section class="panel"><div class="panel-head"><h2>Best time to post</h2></div>
        <div class="hours">${hours.map((v, i) => `<div class="${i === best ? 'best' : ''}" style="height:${v}%" title="${bestLabel(i)}"></div>`).join('')}</div>
        <div class="axis"><span>8 am</span><span>3 pm</span><span>10 pm</span></div>
        <p class="hint" style="margin-top:12px">Your audience is most active around ${bestLabel(best)}.</p>
      </section>
      <section class="panel"><div class="panel-head"><h2>Top posts</h2></div>
        <div class="top-posts">${top.map(m => `<div class="tp"><img src="${m.src}" alt="Image #${m.n}"><div><div>Image #${m.n}</div><div class="hint">${fmtDay(new Date(m.postedAt))}</div></div><div class="num" style="text-align:right">${m.likes} likes<div class="hint">${m.comments} comments</div></div></div>`).join('') || '<p class="hint">Publish a few posts to see them here.</p>'}</div>
      </section>
    </div>
  </div>`;
}

function logRows() {
  const q = ui.q.toLowerCase();
  const list = S.logs.filter(l => (ui.lfilter === 'all' || l.level === ui.lfilter) && (!q || l.msg.toLowerCase().includes(q)));
  return list.length ? list.map(l => `<tr><td class="t num">${new Date(l.t).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</td><td>${esc(l.msg)}</td><td><span class="st ${l.level}">${lvLabel[l.level]}</span></td></tr>`).join('')
    : `<tr><td colspan="3" class="empty">Nothing matches.</td></tr>`;
}
function vLogs() {
  const c = k => S.logs.filter(l => k === 'all' || l.level === k).length;
  const seg = [['all', 'All'], ['ok', 'Done'], ['warn', 'Fixed itself'], ['err', 'Needs you']]
    .map(([k, l]) => `<button aria-selected="${ui.lfilter === k}" data-act="lfilter" data-v="${k}">${l} <span class="hint num">${c(k)}</span></button>`).join('');
  return `
  <div class="page-head"><div><h1>Activity log</h1><p class="lead">Everything the autoposter did, and anything that needs your attention.</p></div>
    <button class="btn" data-act="csv">${ic('download', 16)}Download CSV</button></div>
  <section class="panel">
    <div class="log-tools"><div class="seg">${seg}</div><input id="logSearch" placeholder="Search activity" value="${esc(ui.q)}" aria-label="Search activity"></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>What happened</th><th>Status</th></tr></thead><tbody id="logBody">${logRows()}</tbody></table></div>
  </section>`;
}

function vSettings() {
  const a = S.account;
  const f = (label, desc, ctrl) => `<div class="sr"><div><div class="t">${label}</div>${desc ? `<div class="d">${desc}</div>` : ''}</div><div class="ctrl">${ctrl}</div></div>`;
  return `
  <div class="page-head"><div><h1>Settings</h1><p class="lead">Your account, Instagram connection and posting rules.</p></div></div>
  <div class="set">
    <section class="panel"><div class="panel-head"><h2>Profile</h2></div>
      ${f('Your name', '', `<input data-bind="account.name" value="${esc(a.name)}">`)}
      ${f('Brand name', 'Used in captions wherever you write {brand}.', `<input data-bind="account.brand" value="${esc(a.brand)}">`)}
    </section>
    <section class="panel"><div class="panel-head"><h2>Instagram</h2><span class="st ${a.connected ? 'ok' : 'err'}">${a.connected ? 'Connected' : 'Disconnected'}</span></div>
      ${f(esc(a.ig), a.connected ? `Access renews automatically. Next renewal in ${a.renewDays} days.` : 'Reconnect to start publishing again.',
        a.connected ? `<button class="btn danger" data-act="ig-toggle">Disconnect</button>` : `<button class="btn primary" data-act="ig-toggle">Reconnect</button>`)}
    </section>
    <section class="panel"><div class="panel-head"><h2>Posting rules</h2></div>
      ${f('Autoposting', 'Turn off to pause everything without losing your queue.', tgl('automation', S.automation, 'Autoposting'))}
      ${f('Approve each post first', 'Posts wait for your OK on the Overview page before going live.', tgl('approval', S.approval, 'Approve each post first'))}
      ${f('Write captions from each image', 'When off, your caption template is used.', tgl('aiCaptions', S.aiCaptions, 'AI captions'))}
      ${f('Caption language', '', `<select data-bind="language">${['Hinglish', 'English', 'Hindi', 'Marathi'].map(l => `<option ${l === S.language ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
    </section>
    <section class="panel"><div class="panel-head"><h2>Notifications</h2></div>
      ${f('Email me when a post needs attention', '', tgl('notify', S.notify, 'Email alerts'))}
      ${f('Email address', '', `<input type="email" data-bind="email" value="${esc(S.email)}">`)}
    </section>
    <section class="panel"><div class="panel-head"><h2>Demo data</h2></div>
      ${f('Reset dashboard', 'Brings back the sample images, schedule and activity. Your uploads will be removed.', `<button class="btn danger" data-act="reset">Reset</button>`)}
    </section>
  </div>`;
}

const VIEWS = { overview: vOverview, content: vContent, queue: vQueue, schedule: vSchedule, analytics: vAnalytics, logs: vLogs, settings: vSettings };
const NAV = [['overview', 'Overview', 'home'], ['content', 'Content', 'image'], ['queue', 'Queue', 'list'], ['schedule', 'Schedule', 'cal'], ['analytics', 'Analytics', 'chart'], ['logs', 'Activity log', 'alert'], ['settings', 'Settings', 'gear']];

function render() {
  const r = VIEWS[location.hash.replace('#/', '')] ? location.hash.replace('#/', '') : 'overview';
  const errs = S.logs.filter(l => l.level === 'err').length;
  $('#nav').innerHTML = NAV.map(([id, label, icon]) => {
    let c = '';
    if (id === 'queue') c = `<span class="count num">${queue().length}</span>`;
    if (id === 'logs' && errs) c = `<span class="count err num">${errs}</span>`;
    return `<a href="#/${id}" ${id === r ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span>${c}</a>`;
  }).join('');
  $('#acct').innerHTML = `<span class="avatar">${esc(initials(S.account.brand))}</span><div><div>${esc(S.account.ig)}</div><div class="hint">${S.account.connected ? 'Connected' : 'Disconnected'}${CONFIG.SUPABASE_URL ? '' : ' · demo data'}</div></div>`;
  const ab = $('#autoBtn'); ab.setAttribute('aria-pressed', S.automation); ab.innerHTML = `<span class="led"></span>${S.automation ? 'Autoposting on' : 'Autoposting paused'}`;
  $('#me').textContent = initials(S.account.name);
  $('.menu-btn').innerHTML = ic('menu');
  $('#view').innerHTML = VIEWS[r]();
  document.title = `${NAV.find(n => n[0] === r)[1]} · Vertex Autopost`;
  document.body.classList.remove('nav-open');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  const q = queue();
  switch (a) {
    case 'menu-open': document.body.classList.add('nav-open'); break;
    case 'menu-close': document.body.classList.remove('nav-open'); break;
    case 'toggle-auto': S.automation = !S.automation; addLog('ok', S.automation ? 'Autoposting resumed' : 'Autoposting paused'); commit(S.automation ? 'Autoposting resumed' : 'Autoposting paused'); break;
    case 'tg': { const k = el.dataset.key; S[k] = !S[k]; if (k === 'automation') addLog('ok', S[k] ? 'Autoposting resumed' : 'Autoposting paused'); commit('Saved'); break; }
    case 'post-now': { const m = q[0]; if (!m) break; m.status = 'posted'; m.postedAt = new Date().toISOString(); m.likes = 0; m.comments = 0; addLog('ok', `Published image #${m.n} to ${S.account.ig}`); commit('Published'); break; }
    case 'skip': { if (q.length < 2) { toast('Only one post in the queue'); break; } const ids = q.map(m => m.id); ids.push(ids.shift()); setQueueOrder(ids); commit('Moved to the end of the queue'); break; }
    case 'approve': { const m = byId(id); if (m) { m.approved = true; addLog('ok', `Approved image #${m.n}`); commit('Approved'); } break; }
    case 'q-up': case 'q-down': { const ids = q.map(m => m.id), i = ids.indexOf(id), j = a === 'q-up' ? i - 1 : i + 1; if (j < 0 || j >= ids.length) break; [ids[i], ids[j]] = [ids[j], ids[i]]; setQueueOrder(ids); commit(); break; }
    case 'del-media': { const m = byId(id); if (!m || !confirm(`Delete image #${m.n}?`)) break; S.media = S.media.filter(x => x.id !== id); commit('Image deleted'); break; }
    case 'tab': ui.tab = v; render(); break;
    case 'mfilter': ui.mfilter = v; render(); break;
    case 'tpl': S.activeTpl = id; commit(); break;
    case 'tpl-new': { const t = { id: uid(), name: 'New template', body: '{brand}\n\n{hashtags}' }; S.templates.push(t); S.activeTpl = t.id; commit('Template added'); break; }
    case 'tpl-save': { const t = S.templates.find(x => x.id === S.activeTpl); if (!t) break; t.name = $('#tplName').value.trim() || 'Untitled'; t.body = $('#tplBody').value; commit('Template saved'); break; }
    case 'tpl-del': { if (S.templates.length < 2) { toast('Keep at least one template'); break; } if (!confirm('Delete this template?')) break; S.templates = S.templates.filter(x => x.id !== S.activeTpl); S.activeTpl = S.templates[0].id; commit('Template deleted'); break; }
    case 'ins': { const ta = $('#tplBody'); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + v + ta.value.slice(ta.selectionEnd); ta.focus(); ta.selectionStart = ta.selectionEnd = s + v.length; $('#tplPreview').textContent = fill(ta.value); break; }
    case 'tag-del': { const g = S.groups.find(x => x.id === el.dataset.g); g.tags.splice(+el.dataset.i, 1); commit(); break; }
    case 'group-new': S.groups.push({ id: uid(), name: 'New group', tags: [] }); commit('Group added'); break;
    case 'group-del': { if (!confirm('Delete this hashtag group?')) break; S.groups = S.groups.filter(x => x.id !== el.dataset.g); if (!S.groups.find(g => g.id === S.tplGroup)) S.tplGroup = S.groups[0]?.id; commit('Group deleted'); break; }
    case 'slot-add': { const d = el.dataset.day, inp = document.querySelector(`[data-day-input="${d}"]`); const t = inp.value; if (!t) { inp.focus(); toast('Pick a time first'); break; } S.slots[d] = [...new Set([...(S.slots[d] || []), t])]; commit(`Added ${t} on ${d}`); break; }
    case 'slot-del': { const d = el.dataset.day; S.slots[d] = S.slots[d].filter(t => t !== el.dataset.t); commit('Time removed'); break; }
    case 'cal': ui.cal += +v; render(); break;
    case 'range': ui.range = +v; render(); break;
    case 'lfilter': ui.lfilter = v; render(); break;
    case 'csv': {
      const rows = [['time', 'status', 'message'], ...S.logs.map(l => [l.t, lvLabel[l.level], l.msg])];
      const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); aEl.download = 'activity-log.csv'; aEl.click(); break;
    }
    case 'ig-toggle': S.account.connected = !S.account.connected; addLog(S.account.connected ? 'ok' : 'warn', S.account.connected ? `Reconnected ${S.account.ig}` : `Disconnected ${S.account.ig}`); commit(S.account.connected ? 'Instagram reconnected' : 'Instagram disconnected'); break;
    case 'reset': if (confirm('Reset all demo data?')) { S = seed(); commit('Demo data restored'); } break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'tplBody') $('#tplPreview').textContent = fill(t.value);
  if (t.id === 'logSearch') { ui.q = t.value; $('#logBody').innerHTML = logRows(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bind) {
    const path = t.dataset.bind.split('.'); let o = S;
    while (path.length > 1) o = o[path.shift()];
    o[path[0]] = t.value; commit('Saved');
  }
  if (t.id === 'tz') { S.tz = t.value; commit('Time zone saved'); }
  if (t.id === 'tplGroup') { S.tplGroup = t.value; save(); $('#tplPreview').textContent = fill($('#tplBody').value); }
  if (t.dataset.groupName) { S.groups.find(g => g.id === t.dataset.groupName).name = t.value.trim() || 'Untitled'; commit('Saved'); }
  if (t.id === 'file') addFiles([...t.files]);
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset.tagInput) {
    e.preventDefault();
    const g = S.groups.find(x => x.id === t.dataset.tagInput);
    const tags = t.value.split(/[\s,]+/).filter(Boolean).map(x => '#' + x.replace(/^#+/, '').toLowerCase());
    const next = [...new Set([...g.tags, ...tags])];
    if (next.length > 30) { toast('A post can have at most 30 hashtags'); return; }
    g.tags = next; commit();
    document.querySelector(`[data-tag-input="${g.id}"]`)?.focus();
  }
  if (e.key === 'Escape') document.body.classList.remove('nav-open');
});

/* Queue drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const li = e.target.closest?.('[data-qid]'); if (!li) return; dragId = li.dataset.qid; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', e => { e.target.closest?.('[data-qid]')?.classList.remove('dragging'); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => {
  const li = e.target.closest?.('[data-qid]'), drop = e.target.closest?.('#drop');
  if (li && dragId) { e.preventDefault(); document.querySelectorAll('.ql .over').forEach(x => x.classList.remove('over')); li.classList.add('over'); }
  if (drop) { e.preventDefault(); drop.classList.add('over'); }
});
document.addEventListener('dragleave', e => { e.target.closest?.('#drop')?.classList.remove('over'); });
document.addEventListener('drop', e => {
  const li = e.target.closest?.('[data-qid]'), drop = e.target.closest?.('#drop');
  if (li && dragId) {
    e.preventDefault();
    const ids = queue().map(m => m.id).filter(x => x !== dragId);
    ids.splice(ids.indexOf(li.dataset.qid), 0, dragId); setQueueOrder(ids); dragId = null; commit('Queue updated');
  }
  if (drop) { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files].filter(f => /image\/(jpeg|png)/.test(f.type))); }
});

/* Upload: image ko 1080px tak chhota karke save karo */
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1080 / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej; img.src = url;
  });
}
async function addFiles(files) {
  if (!files.length) return;
  const before = JSON.stringify(S.media), nBefore = S.nextN;
  for (const f of files) {
    try { S.media.push({ id: uid(), n: S.nextN++, src: await shrink(f), status: 'queued', caption: '', approved: !S.approval, postedAt: null, likes: 0, comments: 0 }); }
    catch (e) { addLog('err', `Could not read ${f.name}. Use a JPG or PNG file.`); }
  }
  if (!save()) { S.media = JSON.parse(before); S.nextN = nBefore; toast('Browser storage is full. Delete a few images first.'); render(); return; }
  addLog('ok', `Added ${files.length} image${files.length > 1 ? 's' : ''} to the queue`); commit(`${files.length} added to the queue`);
}

/* Countdown har 30 sec update */
setInterval(() => { const el = $('#countdown'); if (el && S.automation) { const d = upcoming(1)[0]; if (d) el.textContent = until(d); } }, 30000);

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
